name: Build & Smoke Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        # macOS is intentionally NOT in the gating matrix: GitHub's macOS
        # runner pool cancelled FIVE consecutive runs with zero executed
        # steps (builds 21+22), and runner-level cancellations bypass
        # job-level continue-on-error — the whole run goes red. macOS keeps
        # full coverage via the manual `test-macos` job below (Actions →
        # Run workflow) until the pool stabilizes.
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Security audit gate (high+ fails the build)
        if: matrix.os == 'ubuntu-latest'
        run: npm audit --audit-level=high
      - name: Secrets scan gate (fails on credential-shaped strings)
        run: node scripts/scan-secrets.mjs .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (full suite)
        run: npm test
      - name: Build
        run: npm run build
      - name: Headless smoke test (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a bash -c 'AETHER_SMOKE=1 npx electron . --no-sandbox'

  # same suite on macOS — manual trigger only while the hosted macOS runner
  # pool cancels jobs before they start (see note above)
  test-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Secrets scan gate (fails on credential-shaped strings)
        run: node scripts/scan-secrets.mjs .
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests (full suite)
        run: npm test
      - name: Build
        run: npm run build

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          # code signing switches itself on when these repo secrets exist;
          # without them the artifacts stay unsigned (dev-grade) — see
          # docs/RELEASE-SIGNING.md (Phase 0 #11)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

appId: dev.aether.browser
productName: Aether
directories:
  output: release
files:
  - out/**
asar: true
npmRebuild: false
# Stamp security fuses into the Electron binary (RunAsNode off, cookie
# encryption on, ASAR integrity) — see scripts/apply-fuses.js
afterPack: scripts/apply-fuses.js
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
  fileAssociations:
    - ext: crx
      name: Aether Extension Package
      role: Viewer
      description: Install this Chrome extension into Aether
    - ext: htm
      name: HTML Document
      role: Viewer
      description: Open this web page in Aether
    - ext: html
      name: HTML Document
      role: Viewer
      description: Open this web page in Aether
linux:
  category: Utility
  icon: build/icon.png
  target:
    - AppImage
    - deb

appId: dev.aether.browser
productName: Aether
directories:
  output: release
files:
  - out/**
asar: true
npmRebuild: false
mac:
  category: public.app-category.productivity
  icon: build/icon.png
  target:
    - dmg
    - zip
win:
  icon: build/icon.ico
  target:
    - nsis
  fileAssociations:
    - ext: crx
      name: Aether Extension Package
      role: Viewer
      description: Install this Chrome extension into Aether
linux:
  category: Utility
  icon: build/icon.png
  target:
    - AppImage
    - deb
